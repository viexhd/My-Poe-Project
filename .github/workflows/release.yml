# Builds the Windows app and publishes it as a GitHub Release.
#
# Release a new version: bump __version__ in
# poe_qol/src/poe_qol/__init__.py (and pyproject.toml) and push to main.
# When no release exists for that version yet, this builds, tests and
# publishes it as tag v<version>. Pushing a v* tag works too.
# From the Actions tab ("Run workflow") it builds the current version;
# tick "publish" to also create or update the release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "poe_qol/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for the current version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap check first, so ordinary pushes to main don't spend a Windows
  # build once the current version is already released.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          v=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' poe_qol/src/poe_qol/__init__.py)
          [ -n "$v" ] || { echo "No __version__ in __init__.py"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            [ "$REF_NAME" = "v$v" ] || { echo "Tag $REF_NAME doesn't match __version__ $v"; exit 1; }
            build=true; publish=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            build=true; publish=$PUBLISH_INPUT
          elif gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            build=false; publish=false
          else
            echo "No release for v$v yet: building and publishing it."
            build=true; publish=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: poe_qol
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poe_qol/requirements.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          python -m pytest -q tests

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe, zip and installer
        run: ./packaging/build_windows.ps1 -Version "${{ needs.plan.outputs.version }}"

      - name: Smoke test the exe
        run: |
          $exe = "dist\TwiceCorrupted\TwiceCorrupted.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content dist\TwiceCorrupted\logs\poe_qol.log -Tail 25 -ErrorAction SilentlyContinue
          if (Test-Path dist\TwiceCorrupted\logs\crash.log) { Get-Content dist\TwiceCorrupted\logs\crash.log }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          $setup = "dist\release\TwiceCorrupted-Setup-${{ needs.plan.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built" }

      - uses: actions/upload-artifact@v5
        with:
          name: TwiceCorrupted-${{ needs.plan.outputs.version }}-windows
          path: poe_qol/dist/release/*
          if-no-files-found: error

      - name: Publish release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.plan.outputs.version }}"
          $tag = "v$v"
          $files = (Get-ChildItem dist\release\*).FullName
          (Get-Content packaging\RELEASE_NOTES.md -Raw).Replace("VERSION", $v) |
            Set-Content -Encoding utf8 release_notes.md
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Twice Corrupted $v" `
              --notes-file release_notes.md --generate-notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
