# =====================================================================
# Default configuration. Profile files under config/profiles/ override
# any of these keys. Nothing in code should hard-code a value that
# exists here.
# =====================================================================

app:
  profile: mapping           # active profile name (file under profiles/)
  global_enabled: true       # master on/off switch
  log_level: INFO

hotkeys:
  emergency_stop: f12        # hard kill-switch, never disabled
  toggle_global: pause       # flips app.global_enabled
  # show/hide main window. Not wired up yet; leave null.
  toggle_ui:     null

# ---- Input simulation tuning ----
input:
  backend: pydirectinput     # pydirectinput | pynput
  pre_click_settle_ms: 30    # sleep after MouseMove before click
  click_jitter_px: 1         # random +/- px jitter on MoveTo

# ---- Vision pipeline ----
# Currently unused by any shipped feature (the template anchor belonged
# to the retired dump sweep). Kept for future on-key-press features.
vision:
  capture_backend: mss
  default_monitor: 1
  template_dir: assets/templates
  match_threshold: 0.86

# ---- Macros ----
# Each macro declares the same top-level keys: enabled, hotkey(s), config.
# Rule for every macro (GGG, https://www.pathofexile.com/developer/docs):
# manually invoked, one set function, at most ONE game action per press.
# The life-flask timer and the inventory / map-stash dump sweeps were
# retired for breaking that rule (docs/COMPLIANCE_REVIEW.md).
macros:

  # ---- Inventory slot highlighter ----
  # Highlight-only: the overlay shows the selected slots, the player
  # clicks them. The `inventory_dump` name is kept so existing
  # calibration / selections in config/user.yaml keep working.
  inventory_dump:
    # Origin resolution order (first non-null wins):
    #   1. origin_relative_to_window – offset from PoE window anchor
    #   2. grid.origin               – absolute screen coordinates
    grid:
      origin: [1988, 612]    # top-left slot centre, screen coords
      cell_size: [53, 55]    # (w, h) spacing between slots
      cols: 12
      rows: 5
    # Window-relative origin – survives window moves / resolution changes.
    # `anchor`: top_left | top_right | bottom_left | bottom_right | center
    # `offset`: [dx, dy] pixels from that anchor to the top-left slot centre.
    # Leave null to disable this mode. Written by the Calibrate dialog.
    origin_relative_to_window: null
    # Game window detection (for origin_relative_to_window and overlay).
    window:
      title_pattern: "Path of Exile"
      class_pattern: null
    # Highlighted slots. Format: [[row, col], ...]  (0-indexed).
    # The UI slot grid writes into this key.
    selected_slots: []
    # Optional named slot profiles, switch by setting `active_slot_profile`.
    active_slot_profile: null   # e.g. "maps_only"
    slot_profile_dir: config/slot_profiles

  # ---- Map stash slot highlighter ----
  # Same tool for a Map stash tab (12 cols × 6 rows in PoE).
  map_stash_dump:
    grid:
      origin: [800, 200]     # PLACEHOLDER – calibrate from the UI
      cell_size: [53, 55]    # same cell pitch as inventory by default
      cols: 12
      rows: 6
    origin_relative_to_window: null
    window:
      title_pattern: "Path of Exile"
      class_pattern: null
    selected_slots: []
    active_slot_profile: null
    slot_profile_dir: config/slot_profiles_map_stash

  coord_picker:
    enabled: true
    hotkeys:
      capture: ctrl+alt+c
      show:    ctrl+alt+v
    save_to: logs/coords.json

# ---- Alt+drag area selection ----
# Hold `modifier` and drag across the inventory to select slots
# (docs/AREA_SELECT.md). Uses the calibration of the grids listed in
# `grids`. The drag only starts inside (or `start_margin_px` around) a
# grid while PoE is focused; Alt+clicks anywhere else reach the game.
area_select:
  enabled: true
  modifier: alt                # alt | ctrl+alt | alt+shift  (not ctrl alone)
  grids: [macros.inventory_dump]   # add macros.map_stash_dump if wanted
  start_margin_px: 12
  click_threshold_px: 6        # smaller drags count as a click on one slot
  order: column_serpentine     # column_serpentine | row_major
  detect_items: true           # screen-capture empty/occupied detection
  skip_empty: true             # leave slots detected as empty out
  occupancy: {std_min: 14, mean_min: 70}
  manual_clear_after_s: 30     # manual highlights clear after this (0 = never)
  debug: false
  overlay:
    visible: true
    fill_opacity: 0.18
    border_px: 2
  # manual       = highlight only; you Ctrl-click each slot (one action
  #                per click: within GGG's rules).
  # experimental = Ctrl-clicks every selected slot for you. Many game
  #                actions per gesture: NOT GGG-compliant. Runs only after
  #                the warning in the Area Select tab is accepted
  #                (`acknowledged`). See docs/COMPLIANCE_REVIEW.md §7.
  transfer_mode: manual
  experimental:
    acknowledged: false
    click_delay_ms: 60         # minimum 20
    max_slots: 60
    modifier_release_timeout_ms: 1500
    abort_move_px: 25

# ---- Map-search trade link generator ----
# Drives the "Map Search" tab. Modifier and preset data live in
# `mod_map_file` (config/map_mods.yaml, v2 schema).
trade:
  league: Mirage
  status: online               # online | onlineleague | any
  item_type_id: map_t16        # default dropdown selection (see map_mods.yaml)
  mod_map_file: config/map_mods.yaml
  # "copy" (default) builds a pre-filled pathofexile.com/trade/search/
  # <league>?q=<json> link. No API call is made; the trade site runs the
  # search itself when the page opens (the same link format Awakened PoE
  # Trade opens). "post" calls the trade site's internal search API from
  # this app; see docs/COMPLIANCE_REVIEW.md before using it.
  url_mode: copy
  base_site: https://www.pathofexile.com/trade/search
  base_api:  https://www.pathofexile.com/api/trade/search
  # Currently-selected (= excluded) mod ids. Persisted by the UI into
  # config/user.yaml so your last selection survives a restart.
  excluded_mods: []

# ---- Currency flipper (poe.ninja-backed) ----
# Ranks currencies by composite flip-attractiveness (volume × spread ×
# stability × confidence × liquidity). See economy/flipper.py for the
# scoring math and src/poe_qol/ui/flipper_widget.py for the UI.
flipper:
  # League defaults to trade.league if unset; the UI lets you override
  # so you can watch a different league without touching the trade tab.
  league: null
  # Drop currencies that trade fewer than this many units a day
  # (poe.ninja exchange volume / price). 10 is enough signal to matter
  # without flooding the table with fringe items.
  min_volume: 10
  # poe.ninja flags thin-data entries as low-confidence; skipping them
  # removes most noise. Flip on to see speculative opportunities.
  include_low_confidence: false
  # Minutes between automatic refreshes. 0 = manual only.
  auto_refresh_minutes: 0
  # Disk cache freshness for poe.ninja responses (seconds). 600 is
  # short enough to stay useful for bulk-flipping sessions while being
  # polite to poe.ninja's free endpoint.
  cache_sec: 600

# ---- Clipboard pricer ----
# Listens on QClipboard and queries pathofexile.com/api/trade for
# comparable listings whenever the user Ctrl+Cs an item in PoE.
# Surfaces a "stale floor" insight that the site itself doesn't.
pricer:
  # Defaults to trade.league if null, same convention as flipper.
  league: null
  # Trade slug for the currency prices should be denominated in.
  # "chaos" covers 95% of use-cases; switch to "divine" late-league.
  have_currency: chaos
  # When true, every Ctrl+C fires a trade-API lookup automatically.
  # Turn off if you prefer to browse items without spamming requests.
  auto_price_on_copy: true

# ---- In-app trade browser ----
# A browser window showing the real pathofexile.com. You log in there
# yourself; Map Search opens its pre-filled search in it. The app never
# reads the browser's cookies and only allows https://*.pathofexile.com
# pages inside it (other links open in your normal browser). Its private
# profile (cookies, cache) lives in %APPDATA%	wice-corrupted	rade-browser.
trade_browser:
  enabled: true              # false = Map Search opens your normal browser

# ---- Wealth: stash sync from your Path of Exile account ----
# Works like Wealthy Exile: "Connect account" opens pathofexile.com's own
# consent page in your browser (OAuth 2.1 + PKCE, public client, loopback
# redirect). The app gets account:profile, account:leagues and
# account:stashes only, reads the chosen stash tabs through GGG's
# official API, prices them with poe.ninja and stores snapshots in
# <user data>/twice-corrupted/wealth.sqlite. See docs/WEALTH_SYNC.md.
wealth:
  oauth:
    # GGG must register the app before account sign-in works
    # (https://www.pathofexile.com/developer/docs, oauth@grindinggear.com).
    # A public client has no secret, so its id is safe to ship here.
    client_id: null
    contact: null              # sent in the User-Agent, as GGG requires
    redirect_port: 0           # 0 = any free port on 127.0.0.1
  league: null               # null = trade.league
  realm: pc                  # pc | xbox | sony
  auto_sync: true
  sync_interval_minutes: 60  # automatic sync interval; minimum 15
  synced_tabs: {}            # {league: [tab ids]}; a league missing = all tabs
  range: 24h                 # 1h 3h 6h 12h 24h 3d 7d 14d 30d all custom
  range_custom: null         # [start, end] epoch seconds, for range: custom
  chart: total               # total | hourly
  chaos_per_divine: 0        # 0 = auto: poe.ninja's Divine Orb price
  overlay_visible: false
  overlay_pos: null          # [x, y], written when you drag the overlay
