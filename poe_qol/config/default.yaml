# =====================================================================
# Default configuration. Profile files under config/profiles/ override
# any of these keys. Nothing in code should hard-code a value that
# exists here.
# =====================================================================

app:
  profile: mapping           # active profile name (file under profiles/)
  global_enabled: true       # master on/off switch
  log_level: INFO

hotkeys:
  emergency_stop: f12        # hard kill-switch, never disabled
  toggle_global: pause       # flips app.global_enabled
  # show/hide main window. Not wired up yet; leave null.
  toggle_ui:     null

# ---- Input simulation tuning ----
input:
  backend: pydirectinput     # pydirectinput | pynput
  pre_click_settle_ms: 30    # sleep after MouseMove before click
  click_jitter_px: 1         # random +/- px jitter on MoveTo

# ---- Vision pipeline ----
# Currently unused by any shipped feature (the template anchor belonged
# to the retired dump sweep). Kept for future on-key-press features.
vision:
  capture_backend: mss
  default_monitor: 1
  template_dir: assets/templates
  match_threshold: 0.86

# ---- Macros ----
# Each macro declares the same top-level keys: enabled, hotkey(s), config.
# Rule for every macro (GGG, https://www.pathofexile.com/developer/docs):
# manually invoked, one set function, at most ONE game action per press.
# The life-flask timer and the inventory / map-stash dump sweeps were
# retired for breaking that rule (docs/COMPLIANCE_REVIEW.md).
macros:

  # ---- Inventory slot highlighter ----
  # Highlight-only: the overlay shows the selected slots, the player
  # clicks them. The `inventory_dump` name is kept so existing
  # calibration / selections in config/user.yaml keep working.
  inventory_dump:
    # Origin resolution order (first non-null wins):
    #   1. origin_relative_to_window – offset from PoE window anchor
    #   2. grid.origin               – absolute screen coordinates
    grid:
      origin: [1988, 612]    # top-left slot centre, screen coords
      cell_size: [53, 55]    # (w, h) spacing between slots
      cols: 12
      rows: 5
    # Window-relative origin – survives window moves / resolution changes.
    # `anchor`: top_left | top_right | bottom_left | bottom_right | center
    # `offset`: [dx, dy] pixels from that anchor to the top-left slot centre.
    # Leave null to disable this mode. Written by the Calibrate dialog.
    origin_relative_to_window: null
    # Game window detection (for origin_relative_to_window and overlay).
    window:
      title_pattern: "Path of Exile"
      class_pattern: null
    # Highlighted slots. Format: [[row, col], ...]  (0-indexed).
    # The UI slot grid writes into this key.
    selected_slots: []
    # Optional named slot profiles, switch by setting `active_slot_profile`.
    active_slot_profile: null   # e.g. "maps_only"
    slot_profile_dir: config/slot_profiles

  # ---- Map stash slot highlighter ----
  # Same tool for a Map stash tab (12 cols × 6 rows in PoE).
  map_stash_dump:
    grid:
      origin: [800, 200]     # PLACEHOLDER – calibrate from the UI
      cell_size: [53, 55]    # same cell pitch as inventory by default
      cols: 12
      rows: 6
    origin_relative_to_window: null
    window:
      title_pattern: "Path of Exile"
      class_pattern: null
    selected_slots: []
    active_slot_profile: null
    slot_profile_dir: config/slot_profiles_map_stash

  coord_picker:
    enabled: true
    hotkeys:
      capture: ctrl+alt+c
      show:    ctrl+alt+v
    save_to: logs/coords.json

# ---- Map-search trade link generator ----
# Drives the "Map Search" tab. Modifier and preset data live in
# `mod_map_file` (config/map_mods.yaml, v2 schema).
trade:
  league: Mirage
  status: online               # online | onlineleague | any
  item_type_id: map_t16        # default dropdown selection (see map_mods.yaml)
  mod_map_file: config/map_mods.yaml
  # "post" POSTs to the PoE trade API and uses the canonical hash URL
  # pathofexile.com/trade expects. "copy" builds a debug ?q= URL that
  # is useful for inspection but won't render on the site.
  url_mode: post
  base_site: https://www.pathofexile.com/trade/search
  base_api:  https://www.pathofexile.com/api/trade/search
  # Currently-selected (= excluded) mod ids. Persisted by the UI into
  # config/user.yaml so your last selection survives a restart.
  excluded_mods: []

# ---- Currency flipper (poe.ninja-backed) ----
# Ranks currencies by composite flip-attractiveness (volume × spread ×
# stability × confidence × liquidity). See economy/flipper.py for the
# scoring math and src/poe_qol/ui/flipper_widget.py for the UI.
flipper:
  # League defaults to trade.league if unset; the UI lets you override
  # so you can watch a different league without touching the trade tab.
  league: null
  # Drop currencies with fewer than this many daily round-trip-able
  # trades (min of pay/receive counts). 10 is enough signal to matter
  # without flooding the table with fringe items.
  min_volume: 10
  # poe.ninja flags thin-data entries as low-confidence; skipping them
  # removes most noise. Flip on to see speculative opportunities.
  include_low_confidence: false
  # Minutes between automatic refreshes. 0 = manual only.
  auto_refresh_minutes: 0
  # Disk cache freshness for poe.ninja responses (seconds). 600 is
  # short enough to stay useful for bulk-flipping sessions while being
  # polite to poe.ninja's free endpoint.
  cache_sec: 600
