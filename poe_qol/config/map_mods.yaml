# ---------------------------------------------------------------------
# Presets: one-click sets of excluded mod ids. The shipped catalogue
# is empty — the UI lets users save their own named presets from
# whatever selection they currently have. Keep the list (even empty)
# so the loader can still find it.
# ---------------------------------------------------------------------
presets: []
